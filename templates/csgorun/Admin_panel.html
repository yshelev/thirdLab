<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta http-equiv="content-type" content="text/html; charset=UTF-8">
        <meta charset="utf-8">
    
    
        {% load static %}
        <link rel="stylesheet" type="text/css" href="{% static 'admin-panel.css' %}">
        <link rel="canonical" href="https://csgoad.run/admin-panel" data-react-helmet="true">
        <title>TrashCases</title>
         <link rel="icon" href="{% static 'icon.png' %}">
    
    
    </head>
    <div id="admin-panel" class="container mx-auto p-4">
        <h1 class="text-3xl font-bold mb-4">Admin Panel</h1>
        <ul>
        {% for case in cases %}
            <li class="mb-4">
            <h2 class="text-2xl font-bold">{{ case.name }}</h2>
            <button class="btn btn-primary" onclick="editCase('{{ case.id }}')">Edit</button>
            <button class="btn btn-danger" onclick="deleteCase('{{ case.id }}')">Delete</button>
            </li>
        {% endfor %}
        </ul>
        <button class="btn btn-success" onclick="createCase()">Create New Case</button>
    </div>
</html>
